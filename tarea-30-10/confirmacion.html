<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Confirmacion</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <div id="resultados">
      <h1>Datos recibidos</h1>
      <p id="salida"></p>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      document.getElementById("salida").innerHTML =
        "<strong>nombre:</strong> " +
        params.get("nombre") +
        "<br>" +
        "<strong>email:</strong> " +
        params.get("email") +
        "<br>" +
        "<strong>curso:</strong> " +
        params.get("curso");
    </script>
  </body>
</html>
